name: APEX replay contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        id: install
        run: python -m pip install -r requirements.lock -e .
      - name: Causal data, models, lifecycle and accounting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Real CLI with GARCH, then independent verification
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          apex demo --out runs/ci-control
          apex verify --run runs/ci-control
      - name: Capture and shadow replay agreement
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          apex demo-capture --out runs/ci-capture
          apex verify-capture --capture runs/ci-capture
      - name: Upload evidence, including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: replay-evidence
          path: |
            test-results.xml
            runs/ci-control
            runs/ci-capture
          if-no-files-found: warn
