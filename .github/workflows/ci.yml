name: APEX replay contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        id: install
        run: python -m pip install -r requirements.lock -e .
      - name: Causal data, models, lifecycle and accounting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Real CLI with GARCH, then independent verification
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          apex demo --out runs/ci-control
          apex verify --run runs/ci-control
      - name: Capture and shadow replay agreement
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          apex demo-capture --out runs/ci-capture
          apex verify-capture --capture runs/ci-capture
      - name: Chronological research, holdout and independent reconstruction
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          apex research-demo --world persistent --variance garch --out runs/ci-research
          apex verify-research --run runs/ci-research
          apex research-demo --world null --out runs/ci-null
          apex verify-research --run runs/ci-null
          apex research-demo --world reversal --out runs/ci-reversal
          apex verify-research --run runs/ci-reversal
      - name: Regime strategy lab, stress controls and persisted reconstruction
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          apex strategy-demo --world positive --out runs/ci-strategy-positive
          apex verify-strategy-lab --run runs/ci-strategy-positive
          apex strategy-demo --world persistent --out runs/ci-strategy
          apex verify-strategy-lab --run runs/ci-strategy
          apex strategy-demo --world null --out runs/ci-strategy-null
          apex verify-strategy-lab --run runs/ci-strategy-null
          apex strategy-demo --world reversal --out runs/ci-strategy-reversal
          apex verify-strategy-lab --run runs/ci-strategy-reversal
      - name: AI director and peer-information reconstruction
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          apex director-demo --world catchup --out runs/ci-director
          apex verify-director --run runs/ci-director
      - name: Persistent paper account and loss control
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          apex paper-demo --out runs/ci-paper-positive
          apex verify-paper --root runs/ci-paper-positive
          apex paper-demo --world adverse --out runs/ci-paper-adverse
          apex verify-paper --root runs/ci-paper-adverse
          apex paper-report --root runs/ci-paper-positive --format text
      - name: Upload evidence, including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: replay-evidence
          path: |
            test-results.xml
            runs/ci-control
            runs/ci-capture
            runs/ci-research
            runs/ci-null
            runs/ci-reversal
            runs/ci-strategy-positive
            runs/ci-strategy
            runs/ci-strategy-null
            runs/ci-strategy-reversal
            runs/ci-director
            runs/ci-paper-positive
            runs/ci-paper-adverse
          if-no-files-found: warn
